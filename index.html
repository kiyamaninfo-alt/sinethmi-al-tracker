<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/emblem.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Level Mission Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    />
    <script>
      (function () {
        try {
          var p = window.location.pathname;
          var isLanding = p === '/' || p === '/landing';
          var raw = localStorage.getItem('candidate_profile');
          var t = 'cyberpunk', f = 'default';
          if (raw) {
            var cp = JSON.parse(raw);
            if (cp && cp.preferences) {
              if (cp.preferences.theme) t = cp.preferences.theme;
              if (cp.preferences.fontSize) f = cp.preferences.fontSize;
            }
          }
          if (isLanding) { t = 'cyberpunk'; f = 'default'; }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-font', f);
          if (t === 'minimal_light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface text-on-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
