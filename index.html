<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/emblem.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Level Mission Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="https://fonts.gstatic.com/s/materialsymbolsoutlined/v377/kJEhBvYX7BgnkSrUwT8OhrdQw4oELdPIeeII9v6oFsI.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    />
    <style>
      svg {
        width: 1.25rem;
        height: 1.25rem;
        display: inline-block;
        flex-shrink: 0;
      }
      body {
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .material-symbols-outlined {
        display: inline-block;
        width: 1em;
        height: 1em;
        line-height: 1;
        overflow: hidden;
        vertical-align: -0.125em;
        user-select: none;
        letter-spacing: normal;
        white-space: nowrap;
        text-transform: none;
        word-wrap: normal;
        direction: ltr;
      }
      #root {
        opacity: 0;
        transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #root:not(:empty) {
        opacity: 1;
      }
      .app-initial-skeleton {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #070b14;
        z-index: 99999;
      }
      .app-initial-spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid rgba(6, 182, 212, 0.15);
        border-top-color: #06b6d4;
        animation: app-spin 0.75s linear infinite;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      (function () {
        try {
          var p = window.location.pathname;
          var isLanding = p === '/' || p === '/landing';
          var raw = localStorage.getItem('candidate_profile');
          var t = 'cyberpunk', f = 'default';
          if (raw) {
            var cp = JSON.parse(raw);
            if (cp && cp.preferences) {
              if (cp.preferences.theme) t = cp.preferences.theme;
              if (cp.preferences.fontSize) f = cp.preferences.fontSize;
            }
          }
          if (isLanding) { t = 'cyberpunk'; f = 'default'; }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-font', f);
          if (t === 'minimal_light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface text-on-surface">
    <div id="root">
      <div class="app-initial-skeleton">
        <div class="app-initial-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
