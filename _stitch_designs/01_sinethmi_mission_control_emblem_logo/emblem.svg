<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Cosmic Glass Hexagon -->
  <polygon points="60,6 106,32 106,88 60,114 14,88 14,32" fill="#0b1326" stroke="url(#glowRing)" stroke-width="2.5" />
  <!-- Inner Orbit Ring -->
  <circle cx="60" cy="60" r="38" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="60" cy="60" r="28" stroke="rgba(6,182,212,0.25)" stroke-width="1" />
  <!-- Rocket Delta / Upward Mission Ascent Glyph -->
  <path d="M60 22 L76 72 L60 62 L44 72 Z" fill="url(#primaryGrad)" filter="url(#neonGlow)" />
  <!-- Core Mastery Spark / Atom Nucleus -->
  <circle cx="60" cy="62" r="3.5" fill="#FFFFFF" />
  <!-- Orbiting Achievement Nodes -->
  <circle cx="86" cy="42" r="3" fill="#10B981" />
  <circle cx="34" cy="78" r="2.5" fill="#8B5CF6" />
  <circle cx="60" cy="95" r="2" fill="#06B6D4" />
  <!-- Bottom Vector Wings -->
  <path d="M38 78 L26 84 M82 78 L94 84" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round" />
</svg>